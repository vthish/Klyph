<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- Ambient Glow behind symbol -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Stylized Klyph "K" + Downloader Symbol -->
  <!-- Left Pillar of K -->
  <rect x="140" y="130" width="48" height="252" rx="24" fill="url(#brandGrad)" />
  
  <!-- Upper Diagonal Wing of K -->
  <path d="M188 236 L300 134 C314 122 336 126 346 142 C356 156 352 178 336 188 L238 276 Z" fill="url(#brandGrad)" />

  <!-- Lower Downward Download Arrow Wing of K -->
  <path d="M228 252 L320 336 C334 348 356 346 366 330 C376 316 374 294 358 282 L274 206 Z" fill="url(#brandGrad)" />

  <!-- Downloader Arrow Core Tip -->
  <path d="M280 340 L350 400 L370 320 Z" fill="#00f2fe" opacity="0.9" />

  <!-- Glowing Accent Dots -->
  <circle cx="370" cy="140" r="14" fill="#00f2fe" />
  <circle cx="130" cy="380" r="10" fill="#8a2be2" />
</svg>